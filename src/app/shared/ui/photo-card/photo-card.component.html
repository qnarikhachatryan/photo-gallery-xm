@let currentPhoto = photo();

<button type="button" class="photo-card" (click)="photoSelect.emit(currentPhoto.id)">
  <img
    class="photo-card__image"
    [ngSrc]="thumbnailUrl()"
    [alt]="currentPhoto.author"
    [width]="thumbnailWidth"
    [height]="thumbnailHeight"
    [priority]="priority()"
  />

  <mat-icon class="photo-card__icon" [class.photo-card__icon--active]="isFavorite()">
    favorite
  </mat-icon>
</button>
