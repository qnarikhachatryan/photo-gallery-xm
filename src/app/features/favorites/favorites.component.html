@let favoritePhotos = photos();

@if (favoritePhotos.length) {
  <app-photo-grid
    [photos]="favoritePhotos"
    [favoriteIds]="favorites.favoriteIdSet()"
    (photoSelect)="openPhoto($event)"
  />
} @else {
  <div class="favorites__empty">
    <span>No favorites yet</span>
    <a matButton="outlined" routerLink="/">Browse photos</a>
  </div>
}
