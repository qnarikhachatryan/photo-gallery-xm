@let photos = store.photos();
@let isEmpty = photos.length === 0;

@if (!isEmpty) {
  <app-photo-grid
    [photos]="photos"
    [favoriteIds]="favorites.favoriteIdSet()"
    (photoSelect)="favorites.toggle($event)"
  />
} @if (store.loading()) {
  <app-loader [class.photos__loader--initial]="isEmpty" />
} @else if (store.error()) {
  <div class="photos__error">
    <span>Could not load photos</span>
    <button matButton="outlined" type="button" (click)="store.loadNext()">Try again</button>
  </div>
} @else if (store.hasMore()) {
  <div class="photos__sentinel" appInfiniteScroll (scrolled)="store.loadNext()"></div>
} @else if (isEmpty) {
  <p class="photos__empty">No photos available</p>
}
